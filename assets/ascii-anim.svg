      <text class="gold" x="24" y="197" xml:space="preserve">                             .     *      .</text>
      <text class="sky" x="24" y="225" xml:space="preserve">            /\                         /\</text>
      <text class="sky" x="24" y="253" xml:space="preserve">       /\  /  \     /\        /\     /  \   /\</text>
      <text class="text" x="24" y="281" xml:space="preserve">      /  \/____\___/  \______/  \___/____\/  \</text>
      <text class="muted" x="24" y="309" xml:space="preserve">                  ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~</text>
