      <text class="prompt" x="24" y="351" xml:space="preserve">pacheco@github</text><text class="muted" x="162" y="351" xml:space="preserve">:~$</text>
      <rect x="193" y="337" width="9" height="16" fill="#dce6ff"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5001;1" dur="1s" repeatCount="indefinite"/></rect>
