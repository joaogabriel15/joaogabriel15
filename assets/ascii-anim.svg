      <text class="gold" x="24" y="141" xml:space="preserve">                 .                 *             .</text>
      <text class="sky" x="24" y="169" xml:space="preserve">        *                 .                   .</text>
      <text class="gold" x="24" y="197" xml:space="preserve">                             .     *      .</text>
