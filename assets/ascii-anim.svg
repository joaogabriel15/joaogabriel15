      <text class="prompt" x="24" y="351" xml:space="preserve">pacheco@github</text><text class="muted" x="162" y="351" xml:space="preserve">:~$</text>
      <rect class="cursor" x="193" y="337" width="9" height="16" fill="#dce6ff"/>
