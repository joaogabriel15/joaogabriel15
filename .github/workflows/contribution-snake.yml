name: Atualizar animação das contribuições

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar a animação do histórico de contribuições
        uses: Platane/snk@v3
        with:
          github_user_name: joaogabriel15
          outputs: |
            dist/github-snake-light.svg?color_snake=%23b0741c&color_dots=%23eee6d0,%23dfc98e,%23cba85a,%23b0741c,%23705216
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23f2c94c&color_dots=%230f1c3d,%231c2b52,%232b3b63,%237d90ba,%23aabde0

      - name: Publicar as animações
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
